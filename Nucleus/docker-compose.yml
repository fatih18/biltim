# ---------------------------------------------------------------------------
# Biltim — the product itself. Two containers, nothing else.
#
# This replaces scripts/bundle-for-deployment.ts. That script built a folder you
# copied onto a Windows box, which installed Node from a bundled MSI and started
# two background jobs from a PowerShell script. Nothing supervised those jobs,
# nothing restarted them, and "is it up?" had no answer except looking.
#
# THIS FILE ASSUMES POSTGRES AND REDIS ALREADY EXIST — the customer's own, named
# in apps/be-nucleus/.env.docker. That is the normal case and it is the default
# on purpose: the customer's database is the one thing this deployment must not
# invent.
#
#   customer already runs Postgres/Redis   docker compose up -d --build
#   nothing exists yet, bring our own      add -f docker-compose.db.yml
#
# The frontend image is not tied to any URL. Every call the browser makes is
# same-origin — the screens call Next server actions, and the few handlers under
# app/api proxy onward — so only AUTH_API_URL points at the backend and it is
# read at RUNTIME. A hostname change is a restart, never a rebuild.
# ---------------------------------------------------------------------------

name: biltim

services:
  be:
    build:
      context: .
      dockerfile: apps/be-nucleus/Dockerfile
    image: biltim-be:latest
    container_name: biltim-be
    restart: unless-stopped
    env_file:
      - apps/be-nucleus/.env.docker
    ports:
      - "${BE_PORT:-1001}:1001"

  fe:
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
    image: biltim-fe:latest
    container_name: biltim-fe
    restart: unless-stopped
    # service_healthy, not service_started. The backend spends its first boot
    # pushing schema and seeding ~2,700 claims; a frontend that starts talking
    # during that window renders errors to whoever is watching the deploy.
    depends_on:
      be:
        condition: service_healthy
    env_file:
      - apps/fe/.env.docker
    ports:
      - "${FE_PORT:-3000}:3000"
